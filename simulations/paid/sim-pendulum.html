<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pendulum · Advanced Analysis</title>
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="sim-ui.css">
</head>
<body>
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="simulation">◎ Simulation</button>
    <button class="tab-btn" data-tab="analysis">⌇ Analysis</button>
    <button class="tab-btn" data-tab="data">⊞ Data</button>
  </nav>
  <main id="panel-simulation" class="panel active">
    <div class="canvas-zone" id="canvas-container">
      <canvas id="render-canvas"></canvas>
      <button class="settings-btn" id="btn-settings" aria-label="Parameters">⚙</button>
      <div class="hud">
        <div class="hud-pill"><span class="lbl">θ</span><span class="val" id="hud-theta">0.000</span></div>
        <div class="hud-pill"><span class="lbl">ω</span><span class="val" id="hud-omega">0.000</span></div>
        <div class="hud-pill"><span class="lbl">KE</span><span class="val" id="hud-ke">0.000</span></div>
        <div class="hud-pill"><span class="lbl">PE</span><span class="val" id="hud-pe">0.000</span></div>
        <div class="hud-pill"><span class="lbl">t</span><span class="val" id="hud-time">0.000 s</span></div>
      </div>
    </div>
  </main>
  <main id="panel-analysis" class="panel">
    <div class="analysis-grid">
      <div class="plot-cell"><div class="plot-label">Phase Portrait · θ vs ω</div><canvas id="plot-phase"></canvas></div>
      <div class="plot-cell"><div class="plot-label">Energy Drift · H(t)−H₀</div><canvas id="plot-energy"></canvas></div>
      <div class="plot-cell"><div class="plot-label">θ(t) · Angle vs Time</div><canvas id="plot-timeseries"></canvas></div>
      <div class="plot-cell"><div class="plot-label">Poincaré Map · Stroboscopic</div><canvas id="plot-poincare"></canvas></div>
    </div>
    <div class="data-stats">
      <div class="stat-cell"><div class="s-lbl">Max |θ|</div><div class="s-val" id="stat-max-theta">—</div></div>
      <div class="stat-cell"><div class="s-lbl">Max |ω|</div><div class="s-val" id="stat-max-omega">—</div></div>
      <div class="stat-cell"><div class="s-lbl">Max KE</div><div class="s-val" id="stat-max-ke">—</div></div>
      <div class="stat-cell"><div class="s-lbl">H Drift</div><div class="s-val" id="stat-h-drift">—</div></div>
    </div>
  </main>
  <main id="panel-data" class="panel">
    <div class="data-panel-inner">
      <div class="data-toolbar">
        <button class="data-btn" id="btn-csv">↓ CSV</button>
        <button class="data-btn" id="btn-svg">↓ SVG</button>
        <button class="data-btn" id="btn-clear">Clear</button>
        <div class="data-row-count" id="row-count">0 rows</div>
      </div>
      <div class="table-wrap"><table id="data-table"><thead><tr><th>t (s)</th><th>θ</th><th>ω</th><th>KE</th><th>PE</th><th>H drift</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </main>
  <div class="side-backdrop" id="backdrop"></div>
  <aside class="side-panel" id="side-panel">
    <div class="side-panel-header"><div class="side-panel-title">Parameters</div><button class="side-panel-close" id="btn-close">✕</button></div>
    <div class="side-panel-body">
      <div class="integration-method-row">
        <button class="integration-btn active" data-method="rk4">RK4</button>
        <button class="integration-btn" data-method="symplectic">Symplectic</button>
        <button class="integration-btn" data-method="euler">Euler</button>
      </div>
      <div class="side-section-label">System Properties</div>
      <div class="slider-grid" id="sliders"></div>
      <div class="side-section-label">Initial Conditions</div>
      <div class="action-row">
        <button class="action-btn" data-preset="drop">Drop</button>
        <button class="action-btn" data-preset="reset">Reset</button>
        <button class="action-btn" data-preset="simple">Simple</button>
        <button class="action-btn" data-preset="chaotic">Chaotic</button>
        <button class="action-btn" data-preset="moon">Moon Gravity</button>
      </div>
      <label class="trail-toggle-wrap"><input type="checkbox" id="trail-toggle" checked><span>Trail</span></label>
    </div>
  </aside>
  <script>
  /**
   * Secure Client Renderer - Pro Version
   * ZERO physics/math exposed. Full analysis & export enabled.
   * Server returns authoritative state, energy, and drift metrics.
   */
  (function() {
    'use strict';
    const CFG={length:2.0,gravity:9.81,damping:0.10,driveAmp:0.00,driveFreq:0.667,initialAngle:20,dt:0.016,method:'rk4',showTrail:true,framesPerBatch:120,maxHist:24000};
    let state={theta:0,omega:0,time:0,x:0,y:0};
    let isRunning=false,queue=[],fetching=false,analysisRAF=null;
    const hist={t:[],th:[],om:[],ke:[],pe:[],h:[],x:[],y:[]};
    const $=s=>document.querySelector(s);
    const cvs={main:$('#render-canvas'),phase:$('#plot-phase'),energy:$('#plot-energy'),ts:$('#plot-timeseries'),p:$('#plot-poincare')};
    const ctx=Object.fromEntries(Object.entries(cvs).map(([k,c])=>[k,c.getContext('2d')]));

    const resize=()=>{const dpr=window.devicePixelRatio||1;Object.values(cvs).forEach(c=>{const r=c.parentElement.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);});};
    const drawPendulum=(th,x,y)=>{const c=cvs.main,dpr=window.devicePixelRatio,w=c.width/dpr,h=c.height/dpr;const px=w/2,py=h*0.2,s=Math.min(w,h)*0.6;ctx.main.clearRect(0,0,w,h);ctx.main.strokeStyle='var(--sim-axis)';ctx.main.lineWidth=1;ctx.main.beginPath();for(let o=-s;o<=s;o+=s/5){ctx.main.moveTo(px+o,0);ctx.main.lineTo(px+o,h);ctx.main.moveTo(0,py+o);ctx.main.lineTo(w,py+o);}ctx.main.stroke();if(CFG.showTrail&&hist.th.length>1){ctx.main.beginPath();ctx.main.strokeStyle='rgba(var(--sim-trail),0.3)';ctx.main.lineWidth=2;const st=Math.max(0,hist.th.length-800);for(let i=st;i<hist.th.length-1;i++){const tx=px+hist.x[i]*s,ty=py-hist.y[i]*s;i===st?ctx.main.moveTo(tx,ty):ctx.main.lineTo(tx,ty);}ctx.main.stroke();}const bx=px+x*s,by=py-y*s;ctx.main.strokeStyle='var(--sim-rod)';ctx.main.lineWidth=3;ctx.main.beginPath();ctx.main.moveTo(px,py);ctx.main.lineTo(bx,by);ctx.main.stroke();const bob=(cx,cy,r,hc,bc)=>{const g=ctx.main.createRadialGradient(cx-2,cy-2,0,cx,cy,r*1.5);g.addColorStop(0,hc);g.addColorStop(1,bc);ctx.main.fillStyle=g;ctx.main.beginPath();ctx.main.arc(cx,cy,r,0,Math.PI*2);ctx.main.fill();};bob(px,py,4,'var(--sim-pivot-str)','var(--sim-pivot)');bob(bx,by,8,'var(--sim-bob-hi)','var(--sim-bob-mid)');};
    const plotLine=(c,data,col)=>{const cv=c.canvas,w=cv.width/dpr,h=cv.height/dpr;c.clearRect(0,0,w,h);if(data.length<2)return;const mn=Math.min(...data),mx=Math.max(...data)||1,rng=mx-mn;c.strokeStyle=col;c.lineWidth=1.5;c.beginPath();for(let i=0;i<data.length;i++){const x=(i/data.length)*w,y=h-((data[i]-mn)/rng)*h*0.9-h*0.05;i===0?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();};
    const renderAnalysis=()=>{if(!$('#panel-analysis').classList.contains('active')){analysisRAF=null;return;}plotLine(ctx.phase,hist.om,'var(--sim-phase-line)');plotLine(ctx.energy,hist.h,'var(--sim-energy-ok)');plotLine(ctx.ts,hist.th,'var(--sim-theta-line)');analysisRAF=requestAnimationFrame(renderAnalysis);};

    const sig=()=>{const ts=Date.now();const h=s=>Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,12);return `${ts}.${h(ts+'.'+location.host+'.'+CFG.method)}`;};
    const fetchBatch=async()=>{if(fetching||!isRunning)return;fetching=true;try{const res=await fetch('simulation-engine.php',{method:'POST',headers:{'Content-Type':'application/json','X-Sig':sig()},body:JSON.stringify({action:'batch',type:'pendulum',steps:CFG.framesPerBatch,integrator:CFG.method,...CFG,...state})});const d=await res.json();if(d.states?.length)queue=d.states;if(d.finalState)state=d.finalState;}catch(e){setTimeout(()=>{fetching=false;},800);return;}fetching=false;};

    let last=0,tableTick=0;
    const loop=(now)=>{if(!isRunning){requestAnimationFrame(loop);return;}const dt=Math.min(0.033,(now-last)/1000);last=now;if(queue.length===0&&!fetching)fetchBatch();let r=0;while(queue.length>0&&r<4){const [th,om,t,x,y,ke,pe,hd]=queue.shift();state={theta:th,omega:om,time:t,x,y};hist.t.push(t);hist.th.push(th);hist.om.push(om);hist.ke.push(ke);hist.pe.push(pe);hist.h.push(hd);hist.x.push(x);hist.y.push(y);if(hist.t.length>CFG.maxHist){Object.keys(hist).forEach(k=>hist[k].shift());}r++;}drawPendulum(state.theta,state.x,state.y);$('#hud-theta').textContent=state.theta.toFixed(3);$('#hud-omega').textContent=state.omega.toFixed(3);$('#hud-ke').textContent=(hist.ke.at(-1)||0).toFixed(3);$('#hud-pe').textContent=(hist.pe.at(-1)||0).toFixed(3);$('#hud-time').textContent=state.time.toFixed(3)+' s';if(now-tableTick>400){$('#stat-max-theta').textContent=Math.max(...hist.th.map(Math.abs)).toFixed(3);$('#stat-max-omega').textContent=Math.max(...hist.om.map(Math.abs)).toFixed(3);$('#stat-max-ke').textContent=Math.max(...hist.ke).toFixed(3);$('#stat-h-drift').textContent=Math.max(...hist.h.map(Math.abs)).toFixed(4);const tb=$('#tbody');tb.innerHTML='';const st=Math.max(0,hist.t.length-200);for(let i=st;i<hist.t.length;i++){const tr=document.createElement('tr');tr.innerHTML=`<td>${hist.t[i].toFixed(3)}</td><td>${hist.th[i].toFixed(4)}</td><td>${hist.om[i].toFixed(4)}</td><td>${hist.ke[i].toFixed(3)}</td><td>${hist.pe[i].toFixed(3)}</td><td>${hist.h[i].toFixed(5)}</td>`;tb.appendChild(tr);}$('#row-count').textContent=hist.t.length+' rows';tableTick=now;}requestAnimationFrame(loop);};

    const initSliders=()=>{const specs=[['length',0.5,5,0.1,2],['gravity',0.1,20,0.01,2],['damping',0,2,0.01,2],['driveAmp',0,2,0.01,2],['driveFreq',0.1,3,0.01,2],['initialAngle',-180,180,1,0]];specs.forEach(([k,mn,mx,st,pr])=>{const d=document.createElement('div');d.innerHTML=`<div class="slider-label"><span class="name">${k.replace(/([A-Z])/g,' $1')}</span><span class="val" id="v-${k}">${CFG[k].toFixed(pr)}</span></div><input type="range" min="${mn}" max="${mx}" step="${st}" value="${CFG[k]}" data-k="${k}">`;$('#sliders').appendChild(d);d.querySelector('input').addEventListener('input',e=>{CFG[k]=parseFloat(e.target.value);$('#v-'+k).textContent=CFG[k].toFixed(pr);});});};
    const presets={drop:()=>{CFG.initialAngle=20;reset();},reset:()=>reset(),simple:()=>{CFG.initialAngle=5;CFG.damping=0.05;CFG.driveAmp=0;reset();},chaotic:()=>{CFG.initialAngle=90;CFG.damping=0.1;CFG.driveAmp=1.2;CFG.driveFreq=0.667;reset();},moon:()=>{CFG.gravity=1.62;$('[data-k="gravity"]').value=1.62;$('#v-gravity').textContent='1.62';reset();}};
    const reset=()=>{isRunning=false;queue=[];const rad=CFG.initialAngle*Math.PI/180;state={theta:rad,omega:0,time:0,x:Math.sin(rad)*CFG.length,y:Math.cos(rad)*CFG.length};Object.keys(hist).forEach(k=>hist[k]=[]);$('#tbody').innerHTML='';$('#row-count').textContent='0 rows';};
    $('[data-preset]').forEach(b=>b.addEventListener('click',e=>presets[e.target.dataset.preset]?.()));
    $('.integration-btn').forEach(b=>b.addEventListener('click',e=>{document.querySelectorAll('.integration-btn').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');CFG.method=e.target.dataset.method;}));
    $('#btn-settings').addEventListener('click',()=>{$('#side-panel').classList.add('open');$('#backdrop').classList.add('open');});
    const closePanel=()=>{$('#side-panel').classList.remove('open');$('#backdrop').classList.remove('open');};
    $('#btn-close').addEventListener('click',closePanel);$('#backdrop').addEventListener('click',closePanel);
    $('#trail-toggle').addEventListener('change',e=>CFG.showTrail=e.target.checked);
    $('.tab-btn').forEach(b=>b.addEventListener('click',e=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$('#panel-'+e.target.dataset.tab).classList.add('active');isRunning=e.target.dataset.tab==='simulation';if(e.target.dataset.tab==='analysis'&&!analysisRAF)analysisRAF=requestAnimationFrame(renderAnalysis);else cancelAnimationFrame(analysisRAF);}));
    $('#btn-csv').addEventListener('click',()=>{let c='t,th,om,ke,pe,h\n';for(let i=0;i<hist.t.length;i++)c+=`${hist.t[i]},${hist.th[i]},${hist.om[i]},${hist.ke[i]},${hist.pe[i]},${hist.h[i]}\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='pendulum-pro.csv';a.click();});
    $('#btn-svg').addEventListener('click',()=>{const d=hist.th.map((v,i)=>` L${i*0.5},${150-Math.sin(v)*60}`).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300"><rect width="100%" height="100%" fill="var(--bg-primary)"/><path d="M0,150${d}" fill="none" stroke="var(--sim-theta-line)" stroke-width="2"/></svg>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='phase-pro.svg';a.click();});
    $('#btn-clear').addEventListener('click',()=>{Object.keys(hist).forEach(k=>hist[k]=[]);state.time=0;$('#tbody').innerHTML='';$('#row-count').textContent='0 rows';});
    window.addEventListener('resize',resize);resize();initSliders();requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
