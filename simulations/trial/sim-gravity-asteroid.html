<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gravity · Asteroid Belt · Trial</title>
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/sim-ui.css">
  <link rel="stylesheet" href="../../assets/css/sim-gravity-asteroid.css">
</head>
<body>

  <!-- Navigation Tabs -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="simulation">◎ Simulation</button>
    <button class="tab-btn locked-tab" disabled>
      <span class="tab-icon">📊</span> Analysis
      <span class="lock-badge">PRO</span>
    </button>
    <button class="tab-btn locked-tab" disabled>
      <span class="tab-icon">📁</span> Data
      <span class="lock-badge">PRO</span>
    </button>
  </nav>

  <!-- Trial Badge -->
  <div class="trial-badge">Trial Version · 30 Bodies · Merge Only</div>

  <!-- SIMULATION PANEL -->
  <main id="panel-simulation" class="panel active">
    <div class="canvas-zone" id="sim-zone">
      <canvas id="sim-canvas"></canvas>
      
      <!-- Settings button (opens parameter panel) -->
      <button class="settings-btn" id="btn-settings" aria-label="Open Parameters">⚙</button>
      
      <!-- HUD -->
      <div class="hud">
        <div class="hud-pill"><span class="lbl">t</span><span class="val" id="hud-time">0 yr</span></div>
        <div class="hud-pill"><span class="lbl">N</span><span class="val" id="hud-count">—</span></div>
        <div class="hud-pill"><span class="lbl">M</span><span class="val" id="hud-mass">—</span></div>
      </div>

      <!-- Event Ticker for collisions -->
      <div class="event-ticker" id="event-ticker">
        <div class="event-tick merge" id="tick-merge"></div>
        <div class="event-tick frag" id="tick-frag"></div>
      </div>
    </div>
  </main>

  <!-- ANALYSIS PANEL (Locked) -->
  <main id="panel-analysis" class="panel">
    <div class="locked-panel-inner">
      <div class="ghost-preview">
        <div class="analysis-grid">
          <div class="plot-cell"><canvas></canvas></div>
          <div class="plot-cell"><canvas></canvas></div>
        </div>
      </div>
      <div class="lock-overlay">
        <div class="lock-icon-big">🔒</div>
        <div class="lock-title">Advanced Analysis</div>
        <div class="lock-sub">Log-log SFD, Accretion/Frag ratios, and Mass evolution.</div>
        <a href="/upgrade" class="upgrade-btn"><span>↑</span> Unlock Pro</a>
      </div>
    </div>
  </main>

  <!-- DATA PANEL (Locked) -->
  <main id="panel-data" class="panel">
    <div class="locked-panel-inner">
      <div class="ghost-preview">
        <table><thead><tr><th>t</th><th>N</th><th>Mass</th></tr></thead></table>
      </div>
      <div class="lock-overlay">
        <div class="lock-icon-big">📊</div>
        <div class="lock-title">Full Data Export</div>
        <div class="lock-sub">Complete collision logs and CSV body history.</div>
        <a href="/upgrade" class="upgrade-btn"><span>↑</span> Unlock Pro</a>
      </div>
    </div>
  </main>

  <!-- SETTINGS SIDE PANEL -->
  <div class="side-backdrop" id="backdrop"></div>
  <aside class="side-panel" id="side-panel">
    <div class="side-panel-header">
      <div class="side-panel-title">Parameters</div>
      <button class="side-panel-close" id="btn-close">✕</button>
    </div>
    <div class="side-panel-body">
      
      <!-- Central Mass Selector -->
      <div class="side-section-label">Central Mass</div>
      <div class="central-mass-row">
        <button class="cm-chip active" data-mass="1.989e30">Solar Star</button>
        <button class="cm-chip" data-mass="5e29">Protostar</button>
        <button class="cm-chip" data-mass="6e24">Super-Earth</button>
        <button class="cm-chip locked-chip" disabled>Custom <span class="lock-badge">PRO</span></button>
      </div>

      <!-- Physics Parameters -->
      <div class="side-section-label">Physics</div>
      <div class="slider-grid" id="physics-sliders"></div>

      <!-- Initial Conditions / Presets -->
      <div class="side-section-label">Initial Conditions</div>
      <div class="action-row">
        <button class="act-btn" data-preset="belt">Asteroid Belt</button>
        <button class="act-btn" data-preset="disk">Proto Disk</button>
        <button class="act-btn" data-preset="chaos">Chaos Cloud</button>
        <button class="act-btn" data-preset="reset">Reset</button>
      </div>

      <label class="trail-toggle-wrap">
        <input type="checkbox" id="trail-toggle" checked>
        <span>Show Orbits</span>
      </label>

    </div>
  </aside>

  <script>
  /**
   * Gravity Asteroid Trial - Secure Client Renderer
   * 
   * No physics logic. Sends state to simulation-engine.php and renders result.
   * Trial Limits: Max 30 bodies, 0.0 Frag Threshold (Merge only).
   */
  (() => {
    'use strict';

    // ─── CONFIGURATION ─────────────────────────────────────────────────
    const CFG = {
      G: 6.674e-11,         // Gravitational constant
      GMultiplier: 1.0,     // User multiplier
      softening: 5e5,       // Softening length in meters (500km)
      timeScale: 31536000,  // Seconds per frame (approx 1 year)
      maxBodies: 30,        // Trial limit
      fragThreshold: 0.0,   // Trial limit (Merge only)
      dt: 31536000,         // Timestep sent to PHP
      simTime: 0,           // Accumulated time
      showTrails: true,
      preset: 'belt'
    };

    // State
    let bodies = []; // Array of {id, x, y, vx, vy, mass, radius, fixed}
    let isRunning = false;
    let frameQueue = [];
    let fetching = false;

    // DOM Refs
    const $ = s => document.querySelector(s);
    const cvs = { sim: $('#sim-canvas') };
    const ctx = cvs.sim.getContext('2d');

    // ─── RENDERING ─────────────────────────────────────────────────────
    const resolveVar = (name) =>
      getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      cvs.sim.width = cvs.sim.parentElement.getBoundingClientRect().width * dpr;
      cvs.sim.height = cvs.sim.parentElement.getBoundingClientRect().height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const draw = (stateBodies) => {
      const w = cvs.sim.width / (window.devicePixelRatio || 1);
      const h = cvs.sim.height / (window.devicePixelRatio || 1);
      ctx.clearRect(0, 0, w, h);

      // Coordinate System: Center is origin.
      // Scale: 1 AU (1.5e11 m) fits in 80% of screen.
      const AU = 1.496e11;
      const scale = (Math.min(w, h) * 0.4) / AU;
      const cx = w / 2;
      const cy = h / 2;

      // Draw Grid/AU markers
      ctx.strokeStyle = resolveVar('--sim-axis');
      ctx.lineWidth = 1;
      for (let au = 0.5; au <= 5; au += 0.5) {
        ctx.beginPath();
        ctx.arc(cx, cy, au * AU * scale, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Draw Bodies
      stateBodies.forEach(b => {
        const x = cx + b.x * scale;
        const y = cy + b.y * scale; // Y is positive up in physics, but canvas is down? 
        // Actually physics y is arbitrary, let's keep it standard: +y is up.
        // Canvas +y is down. So y_screen = cy - b.y * scale.
        const yScreen = cy - b.y * scale;

        // Color based on mass/type
        let color = resolveVar('--body-rock');
        if (b.fixed) color = resolveVar('--body-central');
        else if (b.mass > 1e25) color = resolveVar('--body-planet');
        else if (b.mass > 1e20) color = resolveVar('--body-planetesimal');

        // Radius visualization (logarithmic for visibility)
        const visRadius = Math.max(2, Math.log10(b.radius) * 1.5);

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, yScreen, visRadius, 0, Math.PI * 2);
        ctx.fill();

        // Trail/Orbit path (simplified: just a small vector)
        if (CFG.showTrails && !b.fixed) {
          ctx.strokeStyle = 'rgba(255,255,255,0.2)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, yScreen);
          // Velocity vector scaled down
          ctx.lineTo(x + b.vx * scale * 0.01, yScreen - b.vy * scale * 0.01);
          ctx.stroke();
        }
      });
    };

    // ─── SIGNATURE (matches PHP: hash('md5', $host . $integrator . $ts)) ──
    const md5 = (() => {
      const rotl = (x, n) => (x << n) | (x >>> (32 - n));
      const add = (x, y) => (x + y) | 0;
      const cmn = (q, a, b, x, s, t) => add(rotl(add(add(a, q), add(x, t)), s), b);
      const ff = (a,b,c,d,x,s,t) => cmn((b&c)|((~b)&d),a,b,x,s,t);
      const gg = (a,b,c,d,x,s,t) => cmn((b&d)|(c&(~d)),a,b,x,s,t);
      const hh = (a,b,c,d,x,s,t) => cmn(b^c^d,a,b,x,s,t);
      const ii = (a,b,c,d,x,s,t) => cmn(c^(b|(~d)),a,b,x,s,t);
      return function md5(str) {
        const msg = unescape(encodeURIComponent(str));
        const len = msg.length;
        const words = [];
        for (let i = 0; i < len; i++) words[i >> 2] = (words[i >> 2] || 0) | (msg.charCodeAt(i) << ((i % 4) * 8));
        words[len >> 2] |= 0x80 << ((len % 4) * 8);
        words[(((len + 8) >> 6) << 4) + 14] = len * 8;
        let a=0x67452301, b=0xefcdab89, c=0x98badcfe, d=0x10325476;
        for (let i = 0; i < words.length; i += 16) {
          const [oa,ob,oc,od] = [a,b,c,d];
          a=ff(a,b,c,d,words[i+0],7,-680876936); d=ff(d,a,b,c,words[i+1],12,-389564586); c=ff(c,d,a,b,words[i+2],17,606105819); b=ff(b,c,d,a,words[i+3],22,-1044525330);
          a=ff(a,b,c,d,words[i+4],7,-176418897); d=ff(d,a,b,c,words[i+5],12,1200080426); c=ff(c,d,a,b,words[i+6],17,-1473231341); b=ff(b,c,d,a,words[i+7],22,-45705983);
          a=ff(a,b,c,d,words[i+8],7,1770035416); d=ff(d,a,b,c,words[i+9],12,-1958414417); c=ff(c,d,a,b,words[i+10],17,-42063); b=ff(b,c,d,a,words[i+11],22,-1990404162);
          a=ff(a,b,c,d,words[i+12],7,1804603682); d=ff(d,a,b,c,words[i+13],12,-40341101); c=ff(c,d,a,b,words[i+14],17,-1502002290); b=ff(b,c,d,a,words[i+15],22,1236535329);
          a=gg(a,b,c,d,words[i+1],5,-165796510); d=gg(d,a,b,c,words[i+6],9,-1069501632); c=gg(c,d,a,b,words[i+11],14,643717713); b=gg(b,c,d,a,words[i+0],20,-373897302);
          a=gg(a,b,c,d,words[i+5],5,-701558691); d=gg(d,a,b,c,words[i+10],9,38016083); c=gg(c,d,a,b,words[i+15],14,-660478335); b=gg(b,c,d,a,words[i+4],20,-405537848);
          a=gg(a,b,c,d,words[i+9],5,568446438); d=gg(d,a,b,c,words[i+14],9,-1019803690); c=gg(c,d,a,b,words[i+3],14,-187363961); b=gg(b,c,d,a,words[i+8],20,1163531501);
          a=gg(a,b,c,d,words[i+13],5,-1444681467); d=gg(d,a,b,c,words[i+2],9,-51403784); c=gg(c,d,a,b,words[i+7],14,1735328473); b=gg(b,c,d,a,words[i+12],20,-1926607734);
          a=hh(a,b,c,d,words[i+5],4,-378558); d=hh(d,a,b,c,words[i+8],11,-2022574463); c=hh(c,d,a,b,words[i+11],16,1839030562); b=hh(b,c,d,a,words[i+14],23,-35309556);
          a=hh(a,b,c,d,words[i+1],4,-1530992060); d=hh(d,a,b,c,words[i+4],11,1272893353); c=hh(c,d,a,b,words[i+7],16,-155497632); b=hh(b,c,d,a,words[i+10],23,-1094730640);
          a=hh(a,b,c,d,words[i+13],4,681279174); d=hh(d,a,b,c,words[i+0],11,-358537222); c=hh(c,d,a,b,words[i+3],16,-722521979); b=hh(b,c,d,a,words[i+6],23,76029189);
          a=hh(a,b,c,d,words[i+9],4,-640364487); d=hh(d,a,b,c,words[i+12],11,-421815835); c=hh(c,d,a,b,words[i+15],16,530742520); b=hh(b,c,d,a,words[i+2],23,-995338651);
          a=ii(a,b,c,d,words[i+0],6,-198630844); d=ii(d,a,b,c,words[i+7],10,1126891415); c=ii(c,d,a,b,words[i+14],15,-1416354905); b=ii(b,c,d,a,words[i+5],21,-57434055);
          a=ii(a,b,c,d,words[i+12],6,1700485571); d=ii(d,a,b,c,words[i+3],10,-1894986606); c=ii(c,d,a,b,words[i+10],15,-1051523); b=ii(b,c,d,a,words[i+1],21,-2054922799);
          a=ii(a,b,c,d,words[i+8],6,1873313359); d=ii(d,a,b,c,words[i+15],10,-30611744); c=ii(c,d,a,b,words[i+6],15,-1560198380); b=ii(b,c,d,a,words[i+13],21,1309151649);
          a=ii(a,b,c,d,words[i+4],6,-145523070); d=ii(d,a,b,c,words[i+11],10,-1120210379); c=ii(c,d,a,b,words[i+2],15,718787259); b=ii(b,c,d,a,words[i+9],21,-343485551);
          a=add(a,oa); b=add(b,ob); c=add(c,oc); d=add(d,od);
        }
        return [a,b,c,d].map(n => {
          let s = '';
          for (let j = 0; j < 4; j++) s += ('0' + ((n >> (j*8)) & 0xff).toString(16)).slice(-2);
          return s;
        }).join('');
      };
    })();

    const generateSignature = () => {
      const ts = Date.now();
      // Asteroid has no user-selectable integrator; PHP defaults to 'rk4'
      const hash = md5(location.host + 'rk4' + ts);
      return `${ts}.${hash}`;
    };

    const fetchBatch = async () => {
      if (fetching || !isRunning) return;
      fetching = true;

      // Prepare payload matching PHP keys
      const payload = {
        action: 'batch',
        type: 'gravity-asteroid',
        integrator: 'rk4',
        steps: 60, // Request 60 frames
        bodies: JSON.stringify(bodies),
        G: CFG.G * CFG.GMultiplier,
        softening: CFG.softening,
        dt: CFG.timeScale, // dt in seconds
        sim_time: CFG.simTime,
        frag_threshold: CFG.fragThreshold,
        max_bodies: CFG.maxBodies
      };

      try {
        const res = await fetch('../../simulation-engine.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Sig': generateSignature() },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.states) frameQueue = data.states;
        if (data.finalTime) CFG.simTime = data.finalTime;
        if (data.finalBodies) bodies = data.finalBodies;

        // Update collisions ticker
        if (data.collisions && data.collisions.length > 0) {
          const last = data.collisions[data.collisions.length - 1];
          const tickId = last.type === 'merge' ? 'tick-merge' : 'tick-frag';
          const tick = $(`#${tickId}`);
          if (tick) {
            tick.textContent = `${last.type === 'merge' ? '💥 Merge' : '💔 Frag'} #${last.id_a} + #${last.id_b}`;
            tick.classList.add('show');
            setTimeout(() => tick.classList.remove('show'), 3000);
          }
        }

      } catch (e) { console.error('Simulation error:', e); }
      fetching = false;
    };

    // ─── MAIN LOOP ─────────────────────────────────────────────────────
    const loop = () => {
      if (frameQueue.length === 0 && !fetching) fetchBatch();
      
      if (frameQueue.length > 0) {
        const frame = frameQueue.shift();
        draw(frame.bodies);
        
        // Update HUD
        $('#hud-time').textContent = (frame.t / 31536000).toFixed(1) + ' yr';
        $('#hud-count').textContent = frame.n;
        $('#hud-mass').textContent = (frame.m_max / 1e24).toFixed(2) + ' E';
      }
      
      requestAnimationFrame(loop);
    };

    // ─── INITIALIZATION ────────────────────────────────────────────────
    const init = () => {
      // Sliders
      const sliders = [
        { id: 'timescale', label: 'Time Scale', min: 0, max: 4, step: 1, fmt: v => ['1d','1mo','1yr','5yr','10yr','50yr'][v] || v },
        { id: 'g', label: 'G Multiplier', min: 0.1, max: 10, step: 0.1, fmt: v => v.toFixed(1) + 'x' },
        { id: 'soft', label: 'Softening (km)', min: 100, max: 1000, step: 100, fmt: v => v }
      ];
      // Note: For trial, we just use these for visual config mapping
      // Actual logic below maps slider indices to values
      
      const timeScales = [86400, 2.592e6, 3.1536e7, 1.5768e8, 3.1536e8]; // 1d, 1mo, 1yr, 5yr, 10yr
      
      const slGrid = $('#physics-sliders');
      sliders.forEach(s => {
        const div = document.createElement('div');
        div.className = 'slider-group';
        div.innerHTML = `
          <div class="slider-label"><span class="name">${s.label}</span><span class="val" id="v-${s.id}">${s.fmt(1)}</span></div>
          <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="1" data-id="${s.id}">
        `;
        slGrid.appendChild(div);
        div.querySelector('input').addEventListener('input', e => {
          const val = parseFloat(e.target.value);
          if (s.id === 'timescale') CFG.timeScale = timeScales[val] || timeScales[0];
          if (s.id === 'g') CFG.GMultiplier = val;
          if (s.id === 'soft') CFG.softening = val * 1000;
          $('#v-' + s.id).textContent = s.fmt(val);
        });
      });

      // Central Mass Chips
      document.querySelectorAll('.cm-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          document.querySelectorAll('.cm-chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const m = parseFloat(btn.dataset.mass);
          if (!isNaN(m)) resetBodies(CFG.preset, m);
        });
      });

      // Presets
      const presets = {
        'belt': () => resetBodies('belt'),
        'disk': () => resetBodies('disk'),
        'chaos': () => resetBodies('chaos'),
        'reset': () => resetBodies('belt')
      };
      document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => presets[b.dataset.preset]?.()));

      // UI Toggles
      $('#btn-settings').addEventListener('click', () => { $('#side-panel').classList.add('open'); $('#backdrop').classList.add('open'); });
      $('#btn-close').addEventListener('click', () => { $('#side-panel').classList.remove('open'); $('#backdrop').classList.remove('open'); });
      $('#trail-toggle').addEventListener('change', e => CFG.showTrails = e.target.checked);
      window.addEventListener('resize', resize);

      resize();
      resetBodies('belt'); // Start simulation
      isRunning = true;
      loop();
    };

    const resetBodies = (type = 'belt', centralMass = 1.989e30) => {
      CFG.simTime = 0;
      frameQueue = [];
      const bodiesArr = [];
      // Central Star
      bodiesArr.push({ id: 0, x: 0, y: 0, vx: 0, vy: 0, mass: centralMass, radius: 6.96e8, fixed: true });
      
      const G = CFG.G * CFG.GMultiplier;
      
      if (type === 'belt') {
        // Random belt between 2 and 4 AU
        for (let i = 0; i < 20; i++) {
          const au = 2.0 + Math.random() * 2.0;
          const r = au * 1.496e11;
          const v = Math.sqrt(G * centralMass / r); // Circular orbit velocity
          const angle = Math.random() * Math.PI * 2;
          bodiesArr.push({
            id: i + 1,
            x: r * Math.cos(angle),
            y: r * Math.sin(angle),
            vx: -v * Math.sin(angle),
            vy: v * Math.cos(angle),
            mass: 1e18 + Math.random() * 1e19,
            radius: 1e3 + Math.random() * 1e4,
            fixed: false
          });
        }
      } else if (type === 'disk') {
         for (let i = 0; i < 20; i++) {
          const r = (0.5 + Math.random() * 5) * 1.496e11;
          const v = Math.sqrt(G * centralMass / r);
          const angle = Math.random() * Math.PI * 2;
          bodiesArr.push({ id: i+1, x: r*Math.cos(angle), y: r*Math.sin(angle), vx: -v*Math.sin(angle), vy: v*Math.cos(angle), mass: 1e17, radius: 1e3, fixed: false });
        }
      } else if (type === 'chaos') {
         for (let i = 0; i < 20; i++) {
          bodiesArr.push({ id: i+1, x: (Math.random()-0.5)*1e12, y: (Math.random()-0.5)*1e12, vx: (Math.random()-0.5)*1000, vy: (Math.random()-0.5)*1000, mass: 1e18, radius: 1e4, fixed: false });
        }
      }
      bodies = bodiesArr;
    };

    init();
  })();
  </script>
</body>
</html>
