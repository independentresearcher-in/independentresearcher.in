<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbital Mechanics – Trial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h2 { color: #f0c040; margin-bottom: 4px; font-size: 1.1rem; }
  .trial-badge { background: #f0c040; color: #0d1117; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-bottom: 12px; }
  canvas { border: 1px solid #30363d; border-radius: 8px; }
  .lock-notice { margin-top: 14px; background: #1c2128; border: 1px solid #f0c040; border-radius: 8px; padding: 10px 16px; font-size: 0.8rem; text-align: center; color: #8b949e; max-width: 360px; }
  .lock-notice strong { color: #f0c040; }
</style>
</head>
<body>
<h2>Orbital Mechanics</h2>
<div class="trial-badge">⚡ TRIAL VERSION</div>
<canvas id="c" width="360" height="320"></canvas>
<div class="lock-notice">
  <strong>Trial:</strong> Single planet, fixed orbit. Full version: multi-body gravity, elliptical orbits, Lagrange points, and collision simulation.
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height, cx = W/2, cy = H/2;
let t = 0;
const planets = [{ r: 80, speed: 0.015, size: 8, color: '#58a6ff', trail: [] }];

function draw() {
  ctx.fillStyle = 'rgba(13,17,23,0.3)'; ctx.fillRect(0,0,W,H);
  // star
  const grad = ctx.createRadialGradient(cx,cy,2,cx,cy,22);
  grad.addColorStop(0,'#fff7a0'); grad.addColorStop(1,'#f0c040');
  ctx.beginPath(); ctx.arc(cx,cy,18,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();

  planets.forEach(p => {
    const x = cx + Math.cos(t * p.speed) * p.r;
    const y = cy + Math.sin(t * p.speed) * p.r;
    p.trail.push([x,y]);
    if(p.trail.length > 80) p.trail.shift();
    for(let i=1;i<p.trail.length;i++){
      ctx.beginPath(); ctx.moveTo(p.trail[i-1][0],p.trail[i-1][1]); ctx.lineTo(p.trail[i][0],p.trail[i][1]);
      ctx.strokeStyle=`rgba(88,166,255,${i/p.trail.length*0.4})`; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x,y,p.size,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
  });
  t++; requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
